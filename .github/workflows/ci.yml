name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'person-*/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run code formatting check
        run: npm run format

      # Builds core → server → workers in order: server resolves @dsa-portal/core and workers resolve
      # @dsa-portal/server through their dist/ output, which a fresh checkout doesn't have. tsc type-checks each.
      - name: Typecheck packages
        run: npm run build

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dsa_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dsa_portal
      # DB tests (repositories, queue/full-flow e2e, sync, security roles) use this one; the CI database is throwaway.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dsa_portal
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_ci_key_12345

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core workspace
        run: npm run build -w core

      - name: Run Database Migrations
        run: npm run db:migrate -w server

      - name: Run Seed Verification
        run: npm run db:seed -w server

      - name: Run Test Suites
        run: npm test -- --coverage --runInBand

      - name: Run client test suites (ui-core, web, mobile)
        run: npm test -w ui-core && npm test -w web && npm test -w mobile

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.server
          push: false
          tags: dsa-portal-server:test

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          tags: dsa-portal-workers:test
