events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting: 30 requests/second with a burst of 50
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

    # Docker's DNS. With "resolve" (nginx >= 1.27.3) the API's address is re-resolved, so recreating the
    # server container (a redeploy) doesn't leave nginx proxying to a dead IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream API backend
    upstream api_backend {
        zone api_backend 64k;
        server server:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers come from the API (stricter: X-Frame-Options DENY, CSP, HSTS). Adding them here
        # too sent conflicting duplicates (DENY + SAMEORIGIN), which browsers may treat as invalid.

        client_max_body_size 10M;

        # Prometheus scrapes server:3000/metrics on the internal network; never expose it publicly.
        location = /metrics {
            return 404;
        }

        # Healthcheck endpoint (bypass rate limiting)
        location /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket support for Socket.IO
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API routing with rate limiting
        location /api/ {
            limit_req zone=api_rate_limit burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Fallback for root
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
