global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'dsa_portal_server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['server:3000']
    scrape_timeout: 10s

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres:5432']
