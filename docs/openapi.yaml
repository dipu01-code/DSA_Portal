openapi: 3.0.3
info:
  title: DSA Practice Platform API
  version: 0.0.1
  description: |
    Source of truth for /api/v1. JSON over HTTP, JWT Bearer auth.
    Never change an agreed endpoint, table column, or WebSocket event directly —
    propose changes in /docs/CHANGE_REQUESTS.md.

    **Limits (Day 8, CR-023).** Every route may answer `429 RATE_LIMITED` with a `Retry-After`
    header (requests per minute per IP, and per signed-in user). Bodies over 512 KiB get
    `413 PAYLOAD_TOO_LARGE`. Both use the standard `Error` body. See /docs/threat-model.md.
servers:
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: auth
  - name: problems
  - name: submissions
  - name: stats
  - name: leaderboard
  - name: daily
  - name: admin
  - name: sync

###############################################################################
# Components (single block: schemas, securitySchemes, responses)
###############################################################################
components:
  schemas:
    # ---- Standard error format (used by every 4xx/5xx response) ----
    Error:
      type: object
      required: [error, message, statusCode, timestamp, path]
      properties:
        error:
          type: string
          example: 'VALIDATION_ERROR'
        message:
          type: string
          example: 'difficulty must be one of Easy, Medium, Hard'
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: '/api/v1/problems'

    # ---- Keyset cursor pagination ----
    # Clients paginate by passing the cursor (last seen sort value + id)
    # from the previous page's `nextCursor` in the `cursor` query param.
    CursorPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            type: object
        nextCursor:
          type: string
          nullable: true
          description: |
            Opaque cursor for the next page. Pass as `cursor` query param.
            null when no more pages.
        total:
          type: integer
          nullable: true
          description: Optional total count (may be expensive; omit for large sets)

    # ---- Auth ----
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: access token TTL in seconds

    User:
      type: object
      required: [id, username, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
          default: user
        createdAt:
          type: string
          format: date-time

    # ---- Problem ----
    TestCase:
      type: object
      required: [input, expected]
      properties:
        input:
          type: string
          description: JSON-serialized input passed to the user's solve()
        expected:
          type: string
          description: JSON-serialized expected output

    Problem:
      type: object
      required: [id, title, topic, difficulty, description, starterCode, testCases, hints, solution]
      properties:
        id:
          type: string
        title:
          type: string
        topic:
          type: string
          example: Arrays
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
        description:
          type: string
        starterCode:
          type: string
        testCases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        hints:
          type: array
          items:
            type: string
        solution:
          type: string

    ProblemSummary:
      type: object
      required: [id, title, topic, difficulty]
      properties:
        id:
          type: string
        title:
          type: string
        topic:
          type: string
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]

    # ---- Submission ----
    Submission:
      type: object
      required: [id, problemId, userId, status, passed, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        problemId:
          type: string
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, judged, failed]
        passed:
          type: integer
        total:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              testCaseIndex:
                type: integer
              passed:
                type: boolean
              actual:
                type: string
              expected:
                type: string
        createdAt:
          type: string
          format: date-time
        judgedAt:
          type: string
          format: date-time
          nullable: true

    SubmissionCreate:
      type: object
      required: [problemId, code]
      properties:
        problemId:
          type: string
        code:
          type: string
          description: User's JavaScript solution (must export solve(input))

    # ---- Stats ----
    StatSummary:
      type: object
      required: [attempted, solved, totalProblems]
      properties:
        attempted:
          type: integer
        solved:
          type: integer
        totalProblems:
          type: integer

    TopicStat:
      type: object
      required: [topic, attempted, solved]
      properties:
        topic:
          type: string
        attempted:
          type: integer
        solved:
          type: integer

    StreakStat:
      type: object
      required: [currentStreak, longestStreak, lastSolvedAt]
      properties:
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        lastSolvedAt:
          type: string
          format: date-time
          nullable: true

    DifficultyStat:
      type: object
      required: [difficulty, attempted, solved]
      properties:
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
        attempted:
          type: integer
        solved:
          type: integer

    # ---- Leaderboard ----
    LeaderboardEntry:
      type: object
      required: [userId, username, solved, totalScore, rank]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        solved:
          type: integer
        totalScore:
          type: integer
        rank:
          type: integer

    # ---- Daily challenge ----
    DailyChallenge:
      type: object
      required: [date, problemId, problem]
      properties:
        date:
          type: string
          format: date
        problemId:
          type: string
        problem:
          $ref: '#/components/schemas/Problem'

    # ---- Sync ----
    SyncOperation:
      type: object
      description: One client mutation. The server takes the user from the token, not from userId.
      required:
        [opId, deviceId, entity, operationType, payload, clientTimestamp, hlc, schemaVersion]
      properties:
        serverSeq:
          type: integer
          description: Set by the server (pull only); the pull cursor.
        opId:
          type: string
          format: uuid
          description: Client-generated; makes push idempotent.
        deviceId:
          type: string
        userId:
          type: string
        entity:
          type: string
          enum: [submission, attempt, user_stats, settings, tombstone, problem]
        operationType:
          type: string
          enum: [INSERT, UPDATE, DELETE, UPSERT]
        payload:
          type: object
        clientTimestamp:
          type: string
          format: date-time
        hlc:
          type: string
          description: Hybrid logical clock "<ms>.<counter>.<deviceId>"; last-write-wins for settings.
        schemaVersion:
          type: integer
        createdAt:
          type: string
          format: date-time

    SyncPush:
      type: object
      required: [deviceId, clientVersion, schemaVersion, operations]
      properties:
        deviceId:
          type: string
        clientVersion:
          type: string
        schemaVersion:
          type: integer
        operations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncPushResult:
      type: object
      required: [success, acknowledgedOpIds, duplicateOpIds, serverSeqWatermark, serverTimestamp]
      properties:
        success:
          type: boolean
        acknowledgedOpIds:
          type: array
          items:
            type: string
        duplicateOpIds:
          type: array
          description: Already applied earlier (safe retry); also listed in acknowledgedOpIds.
          items:
            type: string
        serverSeqWatermark:
          type: integer
        serverTimestamp:
          type: string
          format: date-time

    SyncPull:
      type: object
      required: [cursor, hasMore, operations]
      properties:
        cursor:
          type: integer
          description: Pass it back as ?cursor= for the next page.
        hasMore:
          type: boolean
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncBootstrap:
      type: object
      required: [watermarkSeq, problems, userSubmissions, userStats, userSettings, generatedAt]
      properties:
        watermarkSeq:
          type: integer
          description: Start pulling from this cursor after applying the snapshot.
        problems:
          type: array
          items:
            type: object
        userSubmissions:
          type: array
          items:
            type: object
        userStats:
          type: array
          items:
            type: object
        userSettings:
          type: object
        generatedAt:
          type: string
          format: date-time

    # ---- Dead-letter list entry (Day 6) ----
    FailedJob:
      type: object
      required: [id, problemId, userId, attempts, lastError, createdAt, failedAt]
      properties:
        id:
          type: string
        problemId:
          type: string
        userId:
          type: string
        attempts:
          type: integer
          description: Claims used, crashed or stalled runs included
        lastError:
          type: string
          nullable: true
          description: Why the last attempt failed
        createdAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
          nullable: true

  ###############################################################################
  # Security schemes
  ###############################################################################
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  ###############################################################################
  # Reusable responses
  ###############################################################################
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation or business error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

###############################################################################
# Paths
###############################################################################
paths:
  # ===========================================================================
  # Auth
  # ===========================================================================
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      security: []
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Login with username/email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many failed logins from this IP or for this account; retry after Retry-After seconds
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Refresh access token using refresh token cookie
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Logout (clear refresh cookie)
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Logged out

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: authMe
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # Topics
  # ===========================================================================
  /api/v1/topics:
    get:
      tags: [problems]
      operationId: problemsListTopics
      summary: List all available topics
      security: []
      responses:
        '200':
          description: Topic list
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items:
                      type: string
                      example: Arrays

  # ===========================================================================
  # Problems
  # ===========================================================================
  /api/v1/problems:
    get:
      tags: [problems]
      operationId: problemsList
      summary: List problems with optional topic/difficulty filter and keyset pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor from previous page nextCursor
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - in: query
          name: topic
          schema:
            type: string
        - in: query
          name: difficulty
          schema:
            type: string
            enum: [Easy, Medium, Hard]
      responses:
        '200':
          description: Paginated problem list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProblemSummary'

  /api/v1/problems/random:
    get:
      tags: [problems]
      operationId: problemsRandom
      summary: Get a random problem filtered by topic and/or difficulty
      security:
        - bearerAuth: []
      parameters:
        - name: topic
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [Easy, Medium, Hard]
      responses:
        '200':
          description: Random problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/problems/{id}:
    get:
      tags: [problems]
      operationId: problemsGetById
      summary: Get a single problem by id (includes full test cases and solution)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Problem detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Hints / Solutions
  # ===========================================================================
  /api/v1/problems/{id}/hints:
    get:
      tags: [problems]
      operationId: problemsGetHints
      summary: Get hints for a problem (progressive, first N hints)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: upto
          in: query
          schema:
            type: integer
            minimum: 0
            description: Return only the first N hints
      responses:
        '200':
          description: Hints list
          content:
            application/json:
              schema:
                type: object
                required: [hints]
                properties:
                  hints:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/problems/{id}/solution:
    get:
      tags: [problems]
      operationId: problemsGetSolution
      summary: Get the reference solution for a problem (locked until solved)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reference solution
          content:
            application/json:
              schema:
                type: object
                required: [solution]
                properties:
                  solution:
                    type: string
        '403':
          description: Solution not yet unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Submissions
  # ===========================================================================
  /api/v1/submissions:
    post:
      tags: [submissions]
      operationId: submissionsCreate
      summary: Submit code for judging (enqueued for a worker process)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
      responses:
        '202':
          description: Submission queued
          content:
            application/json:
              schema:
                type: object
                required: [submissionId, status]
                properties:
                  submissionId:
                    type: string
                  status:
                    type: string
                    example: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body larger than 512 KiB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Retry after the Retry-After header's seconds. `error` says why:
            `QUOTA_EXCEEDED` (this user's submissions per minute or per day),
            `QUEUE_FULL` (backpressure) or `RATE_LIMITED` (requests per IP or user).
            An idempotent replay is answered before any of these checks.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [submissions]
      operationId: submissionsList
      summary: List current user's submissions (keyset pagination)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor from previous page nextCursor
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - in: query
          name: problemId
          schema:
            type: string
      responses:
        '200':
          description: Paginated submissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'

  /api/v1/submissions/{id}:
    get:
      tags: [submissions]
      operationId: submissionsGetById
      summary: Get submission status and results
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Stats
  # ===========================================================================
  /api/v1/stats/me:
    get:
      tags: [stats]
      operationId: statsMe
      summary: Get current user's overall stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Overall stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StatSummary'
                  - type: object
                    required: [streak, topics, difficulties]
                    properties:
                      streak:
                        $ref: '#/components/schemas/StreakStat'
                      topics:
                        type: array
                        items:
                          $ref: '#/components/schemas/TopicStat'
                      difficulties:
                        type: array
                        items:
                          $ref: '#/components/schemas/DifficultyStat'

  /api/v1/stats/me/topics:
    get:
      tags: [stats]
      operationId: statsMeTopics
      summary: Get per-topic stats for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-topic stats
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopicStat'

  /api/v1/stats/me/streak:
    get:
      tags: [stats]
      operationId: statsMeStreak
      summary: Current user's streak plus the days it is built from (streak calendar)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Streak and solve days
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StreakStat'
                  - type: object
                    required: [days]
                    properties:
                      days:
                        type: array
                        description: UTC dates (YYYY-MM-DD), ascending, on which the user first solved a problem
                        items:
                          type: string
                          format: date
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # Leaderboard
  # ===========================================================================
  /api/v1/leaderboard:
    get:
      tags: [leaderboard]
      operationId: leaderboardList
      summary: Leaderboard - most problems solved, ties broken by who reached that count first
      description: >
        `totalScore` is Easy 1, Medium 2, Hard 3 per solved problem (shown, not used for ranking).
        `period=week` counts only problems first solved in the last 7 days.
      security: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, all]
            default: all
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor from previous page nextCursor
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
      responses:
        '200':
          description: Leaderboard page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeaderboardEntry'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===========================================================================
  # Daily challenge
  # ===========================================================================
  /api/v1/daily-challenge:
    get:
      tags: [daily]
      operationId: dailyGet
      summary: Get today's daily challenge problem (UTC day; the same problem for everyone)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daily challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Admin
  # ===========================================================================
  /api/v1/admin/problems:
    post:
      tags: [admin]
      operationId: adminCreateProblem
      summary: Create a new problem (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [title, topic, difficulty, description, starterCode, testCases, hints, solution]
              properties:
                title:
                  type: string
                topic:
                  type: string
                difficulty:
                  type: string
                  enum: [Easy, Medium, Hard]
                description:
                  type: string
                starterCode:
                  type: string
                testCases:
                  type: array
                  items:
                    $ref: '#/components/schemas/TestCase'
                hints:
                  type: array
                  items:
                    type: string
                solution:
                  type: string
      responses:
        '201':
          description: Problem created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [admin]
      operationId: adminUpdateProblem
      summary: Update an existing problem (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                title:
                  type: string
                topic:
                  type: string
                difficulty:
                  type: string
                  enum: [Easy, Medium, Hard]
                description:
                  type: string
                starterCode:
                  type: string
                testCases:
                  type: array
                  items:
                    $ref: '#/components/schemas/TestCase'
                hints:
                  type: array
                  items:
                    type: string
                solution:
                  type: string
      responses:
        '200':
          description: Problem updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [admin]
      operationId: adminDeleteProblem
      summary: Delete a problem (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Problem deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/problems/{id}/test-cases:
    post:
      tags: [admin]
      operationId: adminAddTestCases
      summary: Add test cases to a problem (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testCases]
              properties:
                testCases:
                  type: array
                  items:
                    $ref: '#/components/schemas/TestCase'
      responses:
        '200':
          description: Test cases added
          content:
            application/json:
              schema:
                type: object
                required: [testCases]
                properties:
                  testCases:
                    type: array
                    items:
                      $ref: '#/components/schemas/TestCase'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/queue/failed:
    get:
      tags: [admin]
      operationId: adminListFailedSubmissions
      summary: Dead-letter list - submissions that failed every retry (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Failed submissions, newest failure first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FailedJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/queue/failed/{id}/requeue:
    post:
      tags: [admin]
      operationId: adminRequeueFailedSubmission
      summary: Put a failed submission back on the queue with a fresh retry budget (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Requeued
          content:
            application/json:
              schema:
                type: object
                required: [submissionId, status]
                properties:
                  submissionId:
                    type: string
                  status:
                    type: string
                    example: queued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Sync (offline-first push/pull)
  # ===========================================================================
  /api/v1/sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: Push a batch of offline client operations (idempotent by opId, max 100)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPush'
      responses:
        '200':
          description: Operations applied (or already applied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      summary: Pull this user's operations after a server_seq cursor
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPull'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: SYNC_CURSOR_EXPIRED, the cursor is older than the 90-day tombstone window; call /sync/bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/bootstrap:
    get:
      tags: [sync]
      operationId: syncBootstrap
      summary: Full snapshot for a new device or after SYNC_CURSOR_EXPIRED
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'
